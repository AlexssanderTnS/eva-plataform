<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA - Evolução Visão Ação</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="#hero" class="navbar-logo">
                EVA
            </a>

            <ul class="navbar-menu">
                <li><a href="#hero">Início</a></li>
                <li><a href="#business">Para Empresas</a></li>
                <li><a href="#for-you">Para Você</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>

            <a href="#journey" class="navbar-cta">
                Conhecer soluções
            </a>
        </nav>
    </header>

    <main>

        <section id="hero" class="hero-section">
            <!-- Hero principal da EVA -->
        </section>

        <section id="wave-divider" class="wave-divider">
            <!-- Transição visual entre Hero e Jornada -->
        </section>

        <section id="journey" class="journey-section">
            <!-- Escolha sua jornada -->

            <section id="business" class="journey-card">
                <!-- Card Para Empresas -->
            </section>

            <section id="for-you" class="journey-card">
                <!-- Card Para Você -->
            </section>
        </section>

    </main>

    <footer id="contact" class="site-footer">
        <!-- Rodapé e contato -->
    </footer>

    <script src="./js/main.js"></script>
</body>
</html>
